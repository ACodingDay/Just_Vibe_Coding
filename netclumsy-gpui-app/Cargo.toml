[package]
name = "netclumsy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8"
gpui-kit = "0.6"
rand = "0.8"
rust-embed = "8.12.0"
serde_json = "1"
rust-i18n = "4.2"
windivert-sys = "0.10.0"
windows = { version = "0.48", features = ["Win32_UI_Shell", "Win32_Security", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_System_Environment"] }

[profile.release]
lto = "thin"
strip = true
