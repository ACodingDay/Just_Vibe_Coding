<div class="flex flex-col h-screen">
    <!-- Navbar -->
    <div class="navbar bg-base-300 w-full">
        <div class="mx-2 flex-1 px-2">
            <span
                class="text-xl font-bold text-red-500 tracking-wide select-none"
                >⚡ VALORANT SGUARD</span
            >
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal items-center gap-1">
                <!-- Theme Controller: toggle with sun/moon icons -->
                <li>
                    <label class="swap swap-rotate">
                        <input
                            type="checkbox"
                            value="dark"
                            class="theme-controller"
                        />
                        <span
                            class="swap-off inline-block size-5 bg-current"
                            style="
                                mask-image: url(&quot;./static/sun.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                        <span
                            class="swap-on inline-block size-5 bg-current"
                            style="
                                mask-image: url(&quot;./static/moon.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                    </label>
                </li>
                <!-- Settings: swap with rotate effect -->
                <li>
                    <label class="swap swap-rotate">
                        <input type="checkbox" onclick="openSettings()" />
                        <span
                            class="swap-on inline-block size-5 bg-current"
                            style="
                                mask-image: url(&quot;./static/setting.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                        <span
                            class="swap-off inline-block size-5 bg-current"
                            style="
                                mask-image: url(&quot;./static/setting.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                    </label>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col flex-1 min-h-0">
        <div class="flex flex-col flex-1 min-h-0 items-center p-5 gap-4 w-full">
            <!-- Process List -->
            <div class="bg-base-200/50 rounded-box w-full">
                <div id="card1" class="flex items-center gap-4 p-4">
                    <div
                        id="status1"
                        class="w-3 h-3 rounded-full bg-slate-600 transition-all duration-300 shrink-0"
                    ></div>
                    <div class="tooltip tooltip-bottom" data-tip="ACE-Guard Client">
                        <h3 class="font-semibold text-sm">SGuard64.exe</h3>
                    </div>
                    <label class="cursor-pointer shrink-0 ml-auto">
                        <input
                            type="checkbox"
                            id="toggle1"
                            class="toggle toggle-error"
                            onchange="toggleFeature(1)"
                        />
                    </label>
                </div>
                <div class="divider my-0"></div>
                <div id="card2" class="flex items-center gap-4 p-4">
                    <div
                        id="status2"
                        class="w-3 h-3 rounded-full bg-slate-600 transition-all duration-300 shrink-0"
                    ></div>
                    <div class="tooltip tooltip-bottom" data-tip="ACE-Guard Service">
                        <h3 class="font-semibold text-sm">SGuardSvc64.exe</h3>
                    </div>
                    <label class="cursor-pointer shrink-0 ml-auto">
                        <input
                            type="checkbox"
                            id="toggle2"
                            class="toggle toggle-error"
                            onchange="toggleFeature(2)"
                        />
                    </label>
                </div>
            </div>

            <!-- Log Section -->
            <div class="w-full flex-1 min-h-0">
                <div class="flex w-full mb-3">
                    <button
                        id="refreshBtn"
                        class="btn btn-soft btn-info btn-sm grow gap-2"
                        onclick="refreshAllStatus()"
                    >
                        <span
                            class="inline-block size-[1.2em] bg-current"
                            style="
                                mask-image: url(&quot;./static/refresh.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                        刷新状态
                    </button>
                    <div class="divider divider-horizontal"></div>
                    <button
                        class="btn btn-soft btn-accent btn-sm grow gap-2"
                        onclick="clearLog()"
                    >
                        <span
                            class="inline-block size-[1.2em] bg-current"
                            style="
                                mask-image: url(&quot;./static/trash.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                        清空日志
                    </button>
                </div>
                <div
                    id="log"
                    class="bg-base-300/50 rounded-lg p-3 min-h-12 text-sm text-slate-400"
                ></div>
            </div>
        </div>

        <!-- Footer: DaisyUI footer component -->
        <footer
            class="footer bg-base-200 text-base-content/60 items-center p-3 text-xs shrink-0"
            style="grid-auto-flow: column; justify-content: space-between"
        >
            <aside class="grid-flow-col items-center gap-2">
                <span
                    class="inline-block size-4 bg-current"
                    style="
                        mask-image: url(&quot;./static/copyright.svg&quot;);
                        mask-size: contain;
                        mask-repeat: no-repeat;
                        mask-position: center;
                    "
                ></span>
                <p>
                    Copyright
                    <span id="footerYear"></span> - MIT -
                    <span id="appVersion"></span>
                </p>
            </aside>
            <nav class="grid-flow-col gap-4">
                <a
                    href="https://github.com/ACodingDay"
                    target="_blank"
                    rel="noopener"
                    class="inline-block size-5 bg-current hover:opacity-70 transition-opacity"
                    style="
                        mask-image: url(&quot;./static/GitHub.svg&quot;);
                        mask-size: contain;
                        mask-repeat: no-repeat;
                        mask-position: center;
                    "
                ></a>
            </nav>
        </footer>
    </div>
</div>
