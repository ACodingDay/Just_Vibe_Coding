<div class="flex flex-col h-screen">
    <!-- Navbar -->
    <div class="navbar bg-base-200">
        <div class="navbar-start">
            <span class="text-xl font-bold text-error tracking-wide select-none">⚡ VALORANT SGUARD</span>
        </div>
        <div class="navbar-end">
            <ul class="menu menu-horizontal items-center gap-1">
                <!-- Theme Controller: toggle with sun/moon icons -->
                <li>
                    <label class="swap swap-rotate">
                        <input type="checkbox" value="dark" class="theme-controller" />
                        <span class="swap-off inline-block size-5 bg-current" style="mask-image: url('./static/sun.svg'); mask-size: contain; mask-repeat: no-repeat; mask-position: center"></span>
                        <span class="swap-on inline-block size-5 bg-current" style="mask-image: url('./static/moon.svg'); mask-size: contain; mask-repeat: no-repeat; mask-position: center"></span>
                    </label>
                </li>
                <!-- Settings: swap with rotate effect -->
                <li>
                    <label class="swap swap-rotate">
                        <input type="checkbox" id="settingsBtn" />
                        <span class="swap-on inline-block size-5 bg-current" style="mask-image: url('./static/setting.svg'); mask-size: contain; mask-repeat: no-repeat; mask-position: center"></span>
                        <span class="swap-off inline-block size-5 bg-current" style="mask-image: url('./static/setting.svg'); mask-size: contain; mask-repeat: no-repeat; mask-position: center"></span>
                    </label>
                </li>
            </ul>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col flex-1 min-h-0">
        <div class="flex flex-col flex-1 min-h-0 items-center p-5 gap-4 w-full">
            <!-- Process List -->
            <div class="bg-base-200/50 rounded-box w-full">
                <div id="card1" class="flex items-center gap-4 p-4">
                    <div
                        id="status1"
                        class="w-3 h-3 rounded-full bg-slate-600 transition-all duration-300 shrink-0"
                    ></div>
                    <div class="tooltip tooltip-right">
                        <div class="tooltip-content">
                            <div class="animate-bounce text-orange-400 text-2xl font-black">ACE-Guard Client</div>
                        </div>
                        <h3 class="font-semibold text-sm">SGuard64.exe</h3>
                    </div>
                    <label class="cursor-pointer shrink-0 ml-auto">
                        <input
                            type="checkbox"
                            id="toggle1"
                            class="toggle toggle-error"
                        />
                    </label>
                </div>
                <div class="divider my-0"></div>
                <div id="card2" class="flex items-center gap-4 p-4">
                    <div
                        id="status2"
                        class="w-3 h-3 rounded-full bg-slate-600 transition-all duration-300 shrink-0"
                    ></div>
                    <div class="tooltip tooltip-right">
                        <div class="tooltip-content">
                            <div class="animate-bounce text-orange-400 text-2xl font-black">ACE-Guard Service</div>
                        </div>
                        <h3 class="font-semibold text-sm">SGuardSvc64.exe</h3>
                    </div>
                    <label class="cursor-pointer shrink-0 ml-auto">
                        <input
                            type="checkbox"
                            id="toggle2"
                            class="toggle toggle-error"
                        />
                    </label>
                </div>
            </div>

            <!-- Log Section -->
            <div class="w-full flex-1 min-h-0">
                <div class="flex w-full mb-3">
                    <button
                        id="refreshBtn"
                        class="btn btn-soft btn-info btn-sm grow gap-2"
                    >
                        <span
                            class="inline-block size-[1.2em] bg-current"
                            style="
                                mask-image: url(&quot;./static/refresh.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                        刷新状态
                    </button>
                    <div class="divider divider-horizontal"></div>
                    <button
                        id="clearBtn"
                        class="btn btn-soft btn-accent btn-sm grow gap-2"
                    >
                        <span
                            class="inline-block size-[1.2em] bg-current"
                            style="
                                mask-image: url(&quot;./static/trash.svg&quot;);
                                mask-size: contain;
                                mask-repeat: no-repeat;
                                mask-position: center;
                            "
                        ></span>
                        清空日志
                    </button>
                </div>
                <div
                    id="log"
                    class="bg-base-300/50 rounded-lg p-3 min-h-12 text-sm text-base-content/60"
                ></div>
            </div>
        </div>

        <!-- Footer -->
        <footer
            class="footer sm:footer-horizontal bg-base-200 text-base-content/60 items-center p-3 text-xs shrink-0"
        >
            <aside class="grid-flow-col items-center">
                <span
                    class="inline-block size-4 bg-current"
                    style="
                        mask-image: url(&quot;./static/copyright.svg&quot;);
                        mask-size: contain;
                        mask-repeat: no-repeat;
                        mask-position: center;
                    "
                ></span>
                <p>
                    Copyright
                    <span id="footerYear"></span> - MIT -
                    <span id="appVersion"></span>
                </p>
            </aside>
            <nav class="grid-flow-col gap-4 place-self-end justify-self-end">
                <a
                    href="https://github.com/ACodingDay"
                    target="_blank"
                    rel="noopener"
                    class="inline-block size-5 bg-current hover:opacity-70 transition-opacity"
                    style="
                        mask-image: url(&quot;./static/GitHub.svg&quot;);
                        mask-size: contain;
                        mask-repeat: no-repeat;
                        mask-position: center;
                    "
                ></a>
            </nav>
        </footer>
    </div>
</div>
