<!DOCTYPE html>
<html lang="zh-CN" data-theme="valorant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant优化工具</title>
    <link href="../vendor/daisyui@5.css" rel="stylesheet" type="text/css" />
    <link href="../vendor/themes.css" rel="stylesheet" type="text/css" />
    <script src="../vendor/browser@4.js"></script>
    <link rel="stylesheet" href="../valorant-themes.css">
    <link rel="stylesheet" href="../index.css">
</head>
<body class="min-h-screen overflow-hidden">
    <div id="app" class="flex items-center justify-center min-h-screen">
        <span class="loading loading-spinner loading-lg text-error"></span>
    </div>

    <script src="../js/main.js" type="module"></script>
    <script>
        // 动态加载 app.html 内容
        fetch('./app.html')
            .then(response => response.text())
            .then(html => {
                const app = document.getElementById('app');
                app.className = '';
                app.innerHTML = html;
            })
            .catch(error => {
                console.error('加载 app.html 失败:', error);
                document.getElementById('app').innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen gap-4">
                        <span class="text-error">页面加载失败</span>
                        <button class="btn btn-error btn-sm" onclick="location.reload()">重试</button>
                    </div>
                `;
            });
    </script>
</body>
</html>
